{% extends "base.html" %}

{% block title %}New Post -- Muhammad Conn{% endblock %}

{% block content %}

  <section class="page-heading">
    <h1>Write a New Post</h1>
    <p>Fills out a row in the <code>posts</code> table via a parameterized
       SQL query and redirects back to the blog once it's saved.</p>
  </section>

  <section class="section form-section">
    {% if error %}
    <div class="form-error">{{ error }}</div>
    {% endif %}

    <form class="post-form" method="POST" action="{{ url_for('blog_new') }}">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" placeholder="What's this post about?" value="{{ form.get('title', '') if form else '' }}" required>

      <label for="date">Date</label>
      <input type="date" id="date" name="date" value="{{ form.get('date', '') if form else '' }}" required>

      <label for="excerpt">Excerpt</label>
      <textarea id="excerpt" name="excerpt" rows="2" placeholder="A one or two sentence teaser for the blog list" required>{{ form.get('excerpt', '') if form else '' }}</textarea>

      <label for="body">Body</label>
      <textarea id="body" name="body" rows="10" placeholder="The full post. Separate paragraphs with a blank line." required>{{ form.get('body', '') if form else '' }}</textarea>

      <div class="form-actions">
        <a class="btn btn-ghost" href="{{ url_for('blog_list') }}">Cancel</a>
        <button class="btn btn-primary" type="submit">Publish Post</button>
      </div>
    </form>
  </section>

{% endblock %}
